<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainStation — 멀티 에이전트 지식 워크스테이션</title>
  <meta name="description" content="개별 AI 에이전트들이 운영하는 지식 워크스테이션 생태계. 소스를 넣고, 증류하고, 질문하세요.">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7C3AED">
</head>
<body>
<div id="app">
  <!-- Header -->
  <header class="header" id="header">
    <div class="header-logo">
      <h1>🧠 <span>BrainStation</span></h1>
    </div>
    <div class="header-stats" id="headerStats"></div>
    <div class="header-actions">
      <button class="btn btn-secondary btn-sm" id="btnCouncil" onclick="app.showCouncil()">🏛️ 협의회</button>
      <button class="btn btn-ghost btn-sm" id="btnHub" onclick="app.showHub()" style="display:none">← 허브</button>
    </div>
  </header>

  <!-- Hub View -->
  <div class="hub-view" id="hubView">
    <div class="hub-grid" id="hubGrid"></div>
  </div>

  <!-- Station View -->
  <div class="station-view" id="stationView" style="display:none">
    <!-- 모바일 상단 탭 네비게이션 -->
    <div class="mobile-tab-bar" id="mobileTabBar">
      <div class="mobile-tab active" data-sec="ingest" onclick="app.switchSection('ingest')">📥<span>입력</span></div>
      <div class="mobile-tab" data-sec="chat" onclick="app.switchSection('chat')">💬<span>질문</span></div>
      <div class="mobile-tab" data-sec="notes" onclick="app.switchSection('notes')">📋<span>노트</span></div>
      <div class="mobile-tab" data-sec="graph" onclick="app.switchSection('graph')">🗺️<span>그래프</span></div>
    </div>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content" id="mainContent">
      <!-- Ingest -->
      <div class="section" id="secIngest">
        <h2 class="section-title">📥 소스 입력</h2>
        <div class="ingest-tabs" id="ingestTabs">
          <div class="ingest-tab active" data-type="text">📝 텍스트</div>
          <div class="ingest-tab" data-type="url">🔗 URL</div>
          <div class="ingest-tab" data-type="pdf">📄 PDF</div>
          <div class="ingest-tab" data-type="image">🖼️ 사진</div>
          <div class="ingest-tab" data-type="youtube">🎬 YouTube</div>
        </div>
        <div class="ingest-input active" id="ingestText"><textarea id="textInput" placeholder="지식을 입력하세요... 에이전트가 증류해드립니다."></textarea></div>
        <div class="ingest-input" id="ingestUrl"><input type="text" id="urlInput" placeholder="https://example.com/article"></div>
        <div class="ingest-input" id="ingestPdf"><input type="file" id="pdfInput" accept=".pdf"><p style="color:var(--text-muted);font-size:0.8rem;margin-top:8px">PDF 파일을 선택하세요 (최대 20MB)</p></div>
        <div class="ingest-input" id="ingestImage"><input type="file" id="imageInput" accept="image/*"><p style="color:var(--text-muted);font-size:0.8rem;margin-top:8px">이미지 파일을 선택하세요 (PNG, JPG, JPEG, WEBP - 최대 20MB)</p></div>
        <div class="ingest-input" id="ingestYoutube"><input type="text" id="youtubeInput" placeholder="https://youtube.com/watch?v=..."></div>
        <div class="ingest-actions">
          <button class="btn btn-primary" id="btnIngest" onclick="app.ingest()">🧪 증류 시작</button>
          <span id="ingestLoading" class="loading" style="display:none"><span class="spinner"></span> 에이전트가 분석 중...</span>
        </div>
        <div class="result-cards" id="ingestResults"></div>
      </div>

      <!-- Chat -->
      <div class="section" id="secChat">
        <h2 class="section-title">💬 질문하기</h2>
        <div class="chat-container">
          <div class="chat-messages" id="chatMessages">
            <div class="empty-state" id="chatEmpty"><div class="icon">💬</div><p>에이전트에게 질문해보세요!</p></div>
          </div>
          <div class="chat-input-bar">
            <input type="text" id="chatInput" placeholder="무엇이든 물어보세요..." onkeydown="if(event.key==='Enter')app.askQuestion()">
            <button class="btn btn-primary" onclick="app.askQuestion()">전송</button>
          </div>
        </div>
      </div>

      <!-- Graph -->
      <div class="section" id="secGraph">
        <h2 class="section-title">🗺️ 지식 그래프</h2>
        <div class="graph-container"><canvas id="graphCanvas"></canvas></div>
      </div>

      <!-- Notes -->
      <div class="section" id="secNotes">
        <h2 class="section-title">📋 노트 목록</h2>
        <div class="notes-toolbar">
          <input type="text" id="noteSearch" placeholder="🔍 노트 검색..." oninput="app.searchNotes()">
        </div>
        <div class="notes-grid" id="notesGrid"></div>
      </div>

      <!-- GC -->
      <div class="section" id="secGC">
        <h2 class="section-title">🧹 정리 에이전트</h2>
        <button class="btn btn-primary btn-lg" onclick="app.runGC()">🧹 정리 시작</button>
        <div id="gcResults" style="margin-top:20px"></div>
      </div>
    </main>
  </div>

  <!-- Council View -->
  <div class="council-view" id="councilView" style="display:none">
    <div class="council-input">
      <h2>🏛️ 협의회 모드</h2>
      <p>모든 에이전트에게 동시에 질문하고, 각자의 관점에서 답변을 받으세요.</p>
      <div class="council-agents" id="councilAgents"></div>
      <div class="input-row">
        <input type="text" id="councilInput" placeholder="모든 에이전트에게 물어볼 질문..." onkeydown="if(event.key==='Enter')app.askCouncil()">
        <button class="btn btn-primary" onclick="app.askCouncil()">🏛️ 질문</button>
      </div>
    </div>
    <div id="councilLoading" class="loading" style="display:none;justify-content:center"><span class="spinner"></span> 에이전트들이 논의 중...</div>
    <div class="council-responses" id="councilResponses"></div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay" style="display:none" onclick="if(event.target===this)app.closeModal()">
    <div class="modal" id="modalContent"></div>
  </div>

  <!-- Toasts -->
  <div class="toast-container" id="toastContainer"></div>
</div>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((reg) => console.log('🚀 PWA 서비스 워커 등록 성공!', reg.scope))
        .catch((err) => console.error('❌ 서비스 워커 등록 실패:', err));
    });
  }
</script>
</body>
</html>
