<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#090514" />
    </radialGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <!-- Neon Brain Station Artwork -->
  <g filter="url(#glow)" stroke="url(#neonGlow)" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Brain Silhouette Outer Shell -->
    <path d="M 256,120 C 180,120 140,170 140,230 C 140,280 170,300 190,320 C 210,340 210,375 230,400 L 282,400 C 302,375 302,340 322,320 C 342,300 372,280 372,230 C 372,170 332,120 256,120 Z" />
    <!-- Center Line -->
    <path d="M 256,140 L 256,380" stroke-dasharray="10 10" opacity="0.6" />
    <!-- Node Points (Glowing dots) -->
    <circle cx="256" cy="120" r="12" fill="#06B6D4" stroke="none" />
    <circle cx="140" cy="230" r="12" fill="#EC4899" stroke="none" />
    <circle cx="372" cy="230" r="12" fill="#8B5CF6" stroke="none" />
    <circle cx="210" cy="320" r="10" fill="#EC4899" stroke="none" />
    <circle cx="302" cy="320" r="10" fill="#8B5CF6" stroke="none" />
    <circle cx="256" cy="230" r="15" fill="#06B6D4" stroke="none" />
    <!-- Interconnecting neural pathways -->
    <path d="M 140,230 Q 200,200 256,230" opacity="0.8"/>
    <path d="M 372,230 Q 312,200 256,230" opacity="0.8"/>
    <path d="M 256,230 L 256,320" opacity="0.8"/>
    <path d="M 210,320 Q 256,300 302,320" opacity="0.6"/>
  </g>
</svg>
